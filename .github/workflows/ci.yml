name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      # test:mcp creates a real linked worktree, which needs a git identity
      - name: Git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - run: npm ci
      - run: npm ci --prefix mcp-server
      - run: npm run test:unit
      - run: npm run test:mcp

  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - run: npm ci
      - run: npm ci --prefix mcp-server

      # Unpacked build only: proves electron-builder packages this Electron
      # version on each OS without spending time on installers.
      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Bundled MCP server starts under the packaged runtime
        run: node tests/packaged-mcp-smoke.cjs
