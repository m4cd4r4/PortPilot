<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tidewatch</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="icon.svg">
<style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#0b1620;color:#d7e4ee;display:grid;grid-template-columns:170px 1fr;min-height:100vh}
aside{background:#0f2030;padding:20px 16px;border-right:1px solid #1c3347}aside b{display:block;font-size:18px;color:#4fd1c5;margin-bottom:22px}aside div{padding:8px 10px;border-radius:8px;color:#8fa8ba}aside .on{background:#17324a;color:#fff}
main{padding:24px 28px}h1{margin:0 0 16px;font-size:22px}.k{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.k div{background:#112638;border:1px solid #1c3347;border-radius:12px;padding:14px}.k small{color:#7e98ab}.k strong{display:block;font-size:30px;color:#fff}
.chart{margin-top:14px;background:#112638;border:1px solid #1c3347;border-radius:12px;padding:14px;height:190px;display:flex;align-items:flex-end;gap:10px}.chart i{flex:1;background:linear-gradient(#4fd1c5,#1f7a8c);border-radius:5px 5px 0 0}</style></head><body>
<aside><b>Tidewatch</b><div class="on">Overview</div><div>Harbours</div><div>Alerts</div><div>Reports</div></aside>
<main><h1>Harbour overview</h1><div class="k"><div><small>Water level</small><strong>2.4 m</strong></div><div><small>Vessels in</small><strong>118</strong></div><div><small>Alerts</small><strong>3</strong></div></div>
<div class="chart"><i style="height:40%"></i><i style="height:62%"></i><i style="height:48%"></i><i style="height:80%"></i><i style="height:70%"></i><i style="height:92%"></i><i style="height:58%"></i><i style="height:66%"></i><i style="height:84%"></i></div></main></body></html>
